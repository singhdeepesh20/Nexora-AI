# Publishes the no-install "Break of the Day" page (apps/web/play.html) to GitHub Pages.
# Manual trigger only: nothing is published until the repository owner runs it
# (Actions tab -> "Publish NEXORA Play" -> Run workflow) after enabling Pages (Settings -> Pages -> GitHub Actions).
name: Publish NEXORA Play
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx pnpm@9.15.9 install --frozen-lockfile
      - run: npx pnpm@9.15.9 --filter @nexora/web exec vitest run src/play
      - run: npx pnpm@9.15.9 --filter @nexora/web build
      - name: Assemble the static play site
        run: |
          mkdir -p site
          cp -r apps/web/dist/assets site/assets
          cp apps/web/dist/favicon.svg site/
          cp apps/web/dist/play.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
