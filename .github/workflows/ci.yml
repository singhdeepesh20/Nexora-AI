name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v5
      - run: npx pnpm@9.15.9 install --frozen-lockfile
      - run: npx pnpm@9.15.9 -r test
      - run: npx pnpm@9.15.9 typecheck
      - run: npx pnpm@9.15.9 build
      - name: Backend lint and tests
        working-directory: backend
        shell: bash
        run: |
          uv sync --frozen
          uv run ruff check nexora tests
          # Surface each failing test as a public annotation (readable without signing in to GitHub).
          uv run pytest -q -rf -p no:warnings 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E '^(FAILED|ERROR) ' pytest.log | while read -r line; do echo "::error title=pytest::$line"; done
          exit $status
