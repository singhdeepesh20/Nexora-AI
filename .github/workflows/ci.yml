name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v5
      - run: npx pnpm@9.15.9 install --frozen-lockfile
      - run: npx pnpm@9.15.9 -r test
      - run: npx pnpm@9.15.9 typecheck
      - run: npx pnpm@9.15.9 build
      - name: Backend lint and tests
        working-directory: backend
        shell: bash
        run: |
          uv sync --frozen
          uv run ruff check nexora tests
          # Surface each failing test as a public annotation (readable without signing in to GitHub).
          set +e  # GitHub runs bash with -e -o pipefail; we need pytest's own exit code
          uv run pytest -q -rf -p no:warnings > pytest.log 2>&1
          status=$?
          cat pytest.log
          grep -E '^(FAILED|ERROR) ' pytest.log | sed 's/^/::error title=pytest::/' || true
          exit $status
