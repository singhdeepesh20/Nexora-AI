[project]
name = "nexora"
version = "0.4.0"
description = "NEXORA backend - local-first AI engineering university"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "numpy>=2.1,<3",
  "scikit-learn>=1.5,<2",
  "httpx>=0.27,<1",
  "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
torch = ["torch>=2.5"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
nexora = "nexora.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # B008: FastAPI Depends() defaults are idiomatic; E501: long prose strings
